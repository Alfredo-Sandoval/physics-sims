<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interstellar Black Hole</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.184.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <div id="viewport"></div>

    <div class="shell">
        <section id="loading" class="status-card" aria-live="polite">
            <h1>Loading</h1>
            <p id="loadingMessage">Compiling shader and generating starfield.</p>
        </section>
    </div>

    <aside id="hud" class="hud" aria-hidden="true">
        <div class="hud__inner">
            <div class="hud__row">
                <div class="hud__group">
                    <div class="ctrl">
                        <label for="distance">Dist</label>
                        <input type="range" id="distance" min="8" max="32" value="18" step="0.5">
                        <span id="distVal" class="value">18.0</span>
                    </div>
                    <div class="ctrl">
                        <label for="angle">Elev</label>
                        <input type="range" id="angle" min="20" max="90" value="82" step="0.5">
                        <span id="angleVal" class="value">82.0°</span>
                    </div>
                    <div class="ctrl">
                        <label for="phi">Orbit</label>
                        <input type="range" id="phi" min="-72" max="72" value="0" step="1">
                        <span id="phiVal" class="value">0°</span>
                    </div>
                </div>

                <div class="hud__sep"></div>

                <div class="view-presets" role="group" aria-label="Orbit presets">
                    <button type="button" data-view="-24" aria-label="Set orbit left view" aria-pressed="false">L</button>
                    <button type="button" data-view="0" aria-label="Set orbit center view" aria-pressed="true">C</button>
                    <button type="button" data-view="24" aria-label="Set orbit right view" aria-pressed="false">R</button>
                </div>

                <div class="hud__sep"></div>

                <div class="hud__group">
                    <button id="toggleMotion" type="button" data-active="false" aria-pressed="false">Play</button>
                    <button id="resetView" class="secondary" type="button">Reset</button>
                    <button id="hudClose" class="secondary" type="button" aria-label="Hide controls">&#x2715;</button>
                </div>
            </div>

            <div class="hud__row">
                <span class="hud__row-label">Disk</span>
                <div class="hud__group">
                    <div class="ctrl">
                        <label for="rin">Inner</label>
                        <input type="range" id="rin" min="1.5" max="6" value="3.8" step="0.1">
                        <span id="rinVal" class="value">3.8</span>
                    </div>
                    <div class="ctrl">
                        <label for="rout">Outer</label>
                        <input type="range" id="rout" min="8" max="25" value="10.5" step="0.5">
                        <span id="routVal" class="value">10.5</span>
                    </div>
                    <div class="ctrl">
                        <label for="spin">Spin</label>
                        <input type="range" id="spin" min="0" max="0.998" value="0.55" step="0.01">
                        <span id="spinVal" class="value">0.55</span>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <div class="toolbar">
        <button id="hudToggle" class="hud-toggle" type="button" data-open="false" aria-controls="hud" aria-expanded="false" aria-label="Show controls">&#x2699;</button>
    </div>

    <script type="module" src="./main.mjs"></script>
</body>
</html>

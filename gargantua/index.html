<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gargantua Black Hole</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.184.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <div id="viewport"></div>

    <div class="shell">
        <section id="loading" class="status-card" aria-live="polite">
            <h1>Loading</h1>
            <p id="loadingMessage">Compiling the ray tracer and generating the starfield.</p>
        </section>
    </div>

    <aside id="hud" class="hud" aria-hidden="true">
        <div class="hud__inner">
            <div class="hud__row">
                <div class="hud__group">
                    <div class="ctrl">
                        <label for="distance">Dist</label>
                        <input type="range" id="distance" min="5" max="250" value="37.05" step="0.05">
                        <span id="distVal" class="value">37.0</span>
                    </div>
                    <div class="ctrl">
                        <label for="angle" title="Viewing inclination: 0° looks down the spin axis, 90° is edge-on">Incl</label>
                        <input type="range" id="angle" min="3" max="177" value="86.56" step="0.01">
                        <span id="angleVal" class="value">86.6°</span>
                    </div>
                    <div class="ctrl">
                        <label for="phi">Orbit</label>
                        <input type="range" id="phi" min="-180" max="180" value="0" step="1">
                        <span id="phiVal" class="value">0°</span>
                    </div>
                </div>

                <div class="hud__sep"></div>

                <div class="view-presets" role="group" aria-label="Inclination presets">
                    <button type="button" data-incl="89.5" aria-label="Set edge-on view" aria-pressed="false">Edge</button>
                    <button type="button" data-incl="86.56" data-look="film" aria-label="Recreate the Interstellar shot" aria-pressed="true">Film</button>
                    <button type="button" data-incl="12" aria-label="Set top-down view" aria-pressed="false">Top</button>
                </div>

                <div class="hud__sep"></div>

                <div class="hud__group">
                    <button id="toggleMotion" type="button" data-active="false" aria-pressed="false">Play</button>
                    <button id="resetView" class="secondary" type="button">Reset</button>
                    <button id="hudClose" class="secondary" type="button" aria-label="Hide controls">&#x2715;</button>
                </div>
            </div>

            <div class="hud__row">
                <span class="hud__row-label">Disk</span>
                <div class="hud__group">
                    <div class="ctrl">
                        <label for="rin">Inner</label>
                        <input type="range" id="rin" min="0.6" max="6" value="2.2" step="0.01">
                        <span id="rinVal" class="value">2.20</span>
                    </div>
                    <div class="ctrl">
                        <label for="rout">Outer</label>
                        <input type="range" id="rout" min="6" max="25" value="13.5" step="0.5">
                        <span id="routVal" class="value">13.5</span>
                    </div>
                    <div class="ctrl">
                        <label for="spin">Spin</label>
                        <input type="range" id="spin" min="0" max="0.998" value="0.6" step="0.01">
                        <span id="spinVal" class="value">0.60</span>
                    </div>
                </div>
            </div>

            <div class="hud__row">
                <span class="hud__row-label">Look</span>
                <div class="hud__group">
                    <div class="ctrl">
                        <label for="realism" title="0 matches the film: no Doppler or gravitational shift and an evenly lit disk. 1 is physical.">Real</label>
                        <input type="range" id="realism" min="0" max="1" value="0" step="0.05">
                        <span id="realismVal" class="value">0.00</span>
                    </div>
                    <div class="ctrl">
                        <label for="temp" title="Peak disk temperature in kelvin">Temp</label>
                        <input type="range" id="temp" min="2500" max="12000" value="4500" step="100">
                        <span id="tempVal" class="value">4500K</span>
                    </div>
                    <div class="ctrl">
                        <label for="fov" title="Vertical field of view of the camera lens">FOV</label>
                        <input type="range" id="fov" min="10" max="90" value="19" step="1">
                        <span id="fovVal" class="value">19°</span>
                    </div>
                    <div class="ctrl">
                        <label for="glow" title="Strength of the soft glow around bright parts of the disk">Glow</label>
                        <input type="range" id="glow" min="0" max="2" value="0.85" step="0.05">
                        <span id="glowVal" class="value">0.85</span>
                    </div>
                    <button id="toggleCinema" type="button" data-active="true" aria-pressed="true" title="Widescreen letterbox, vignette, and film grain (C)">Cinema</button>
                </div>
                <p id="readout" class="readout" aria-live="off"></p>
            </div>
        </div>
    </aside>

    <div class="toolbar">
        <button id="hudToggle" class="hud-toggle" type="button" data-open="false" aria-controls="hud" aria-expanded="false" aria-label="Show controls">&#x2699;</button>
    </div>

    <script type="module" src="./main.mjs"></script>
</body>
</html>

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Solar System smoke and ephemeris checks
        working-directory: Solar-System
        run: npm test

      - name: Gargantua smoke checks and build
        working-directory: gargantua
        run: |
          npm ci
          npm test

      - name: Install Python test dependencies
        run: |
          python -m pip install hypothesis playwright
          python -m playwright install --with-deps chromium

      - name: Ephemeris parser properties
        run: python tests/test_ephemeris_properties.py

      - name: In-browser Solar System tests
        run: python tests/run_browser_tests.py
